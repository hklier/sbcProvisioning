apiVersion: apps/v1
kind: Deployment
metadata:
  name: sbc-provisioning
  labels:
    app.kubernetes.io/name: sbc-provisioning
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: sbc-provisioning
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sbc-provisioning
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker1
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 300
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: web
          image: 192.168.2.240:5000/vf-ro-sbc-provisioning@sha256:adebd8579aa1dd115c6b049a0fa5abf177bad87f01da41a9498e4bb934c59a46
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9080
              name: https
          env:
            - name: SDM_BASE_URL
              value: https://192.168.3.153:8443/rest/v1.3
            - name: APP_USERNAME
              value: admin
            - name: APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sbc-provisioning-auth
                  key: password
            - name: APP_PASSWORD_FILE
              value: /var/lib/sbc-provisioning/password.json
            - name: TLS_KEY_FILE
              value: /run/tls/tls.key
            - name: TLS_CERT_FILE
              value: /run/tls/tls.crt
            - name: COOKIE_SECURE
              value: "true"
          volumeMounts:
            - name: app-data
              mountPath: /var/lib/sbc-provisioning
            - name: sdm-credentials
              mountPath: /run/secrets
              readOnly: true
            - name: tls
              mountPath: /run/tls
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
            periodSeconds: 20
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
      volumes:
        - name: app-data
          persistentVolumeClaim:
            claimName: sbc-provisioning-data-local
        - name: sdm-credentials
          secret:
            secretName: sbc-provisioning-sdm
            defaultMode: 0440
            items:
              - key: credentials
                path: sdm-credentials
        - name: tls
          secret:
            secretName: sbc-provisioning-tls
            defaultMode: 0440
